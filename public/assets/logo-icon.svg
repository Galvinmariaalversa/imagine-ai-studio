<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="prism-grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="glow-grad-icon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="ai-grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="subtle-glow-icon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#prism-grad-icon)" opacity="0.3" filter="blur(5px)"/>
  
  <!-- Outer Rounded Hex/Shield Tile -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#0C0F1A" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.2"/>
  
  <!-- Central Geometric Aperture / AI Starburst Motif -->
  <path d="M20 7L23 15L20 20L17 15Z" fill="url(#prism-grad-icon)"/>
  <path d="M20 33L17 25L20 20L23 25Z" fill="url(#prism-grad-icon)"/>
  <path d="M7 20L15 17L20 20L15 23Z" fill="url(#glow-grad-icon)"/>
  <path d="M33 20L25 23L20 20L25 17Z" fill="url(#ai-grad-icon)"/>

  <!-- Core Spark & Synapses -->
  <circle cx="20" cy="20" r="3.2" fill="#FFFFFF"/>
  <circle cx="10" cy="10" r="1.5" fill="#6366F1" opacity="0.9"/>
  <circle cx="30" cy="10" r="1.5" fill="#EC4899" opacity="0.9"/>
  <circle cx="30" cy="30" r="1.5" fill="#8B5CF6" opacity="0.9"/>
  <circle cx="10" cy="30" r="1.5" fill="#06B6D4" opacity="0.9"/>
</svg>